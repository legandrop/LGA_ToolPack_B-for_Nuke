; LGA ToolPack-B - Valores de fabrica de cada herramienta.
;
; ESTE ARCHIVO NO ES TU CONFIGURACION: son los valores con los que arranca
; el pack. Editarlo funciona, pero viaja adentro del pack y el instalador
; lo reemplaza en cada update, asi que la edicion se pierde ahi.
;
; Para activar o desactivar herramientas: menu TP2 > Enable Tools.
; Eso guarda tu eleccion fuera del pack y ningun update la toca.

[Tools]
; === READ n WRITE ===
Media_Missing_Frames = True
Reload_All_Reads = True
Rename_Writes_From_Reads = True
CopyCat_Cleaner = True
Update_Folder_Favs = True

; === FRAME RANGE ===
FR_Read_to_FrameRange = True
FR_Read_to_Write = True
FR_TimeClip_to_Write = True

; === COPY n PASTE ===
Paste_To_Selected = True
Copy_with_inputs = True
Paste_with_inputs = True
Duplicate_with_inputs = True

; === NODE BUILDS ===
DasGrain_Kronos_Comp = True
AnimationMaker = True
MultiKnobEdit = True
Default_KnobDefaults = True

; === VA ===
OCIOFileTransform_IP = True
CDL_CC_IP = True
Perf_Time = True
Shortcut_Editor = True
